<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Library API</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .login-header i {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .login-body {
            padding: 35px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.2);
        }

        .btn-login {
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .btn-login:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="card shadow-lg login-card">

        <!-- Cabeçalho -->
        <div class="login-header">

            <i class="bi bi-book-half"></i>

            <h2 class="fw-bold mb-1">Library API</h2>

            <p class="mb-0">
                Acesse sua conta
            </p>

        </div>

        <!-- Formulário -->
        <div class="login-body">

            <form method="post" th:action="@{/login}">

                <!-- Usuário -->
                <div class="mb-3">

                    <label for="username" class="form-label fw-semibold">
                        Usuário
                    </label>

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Digite seu usuário"
                                required>

                    </div>

                </div>

                <!-- Senha -->
                <div class="mb-3">

                    <label for="password" class="form-label fw-semibold">
                        Senha
                    </label>

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Digite sua senha"
                                required>

                    </div>

                </div>

                <!-- Botão -->
                <button
                        type="submit"
                        class="btn btn-primary btn-login w-100">

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Entrar

                </button>

            </form>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
